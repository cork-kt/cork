[package]
name = "cork"
version = "1.0.0-alpha1"
edition = "2024"
license = "Apache-2.0"
description = "Fast compression and archive backend for Android"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
lzma-rust2 = { version = "0.21.0", features = ["encoder", "optimization"] }
sevenz-rust2 = { version = "0.23.0", default-features = true }
zip = { version = "9.0.0", default-features = true }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
